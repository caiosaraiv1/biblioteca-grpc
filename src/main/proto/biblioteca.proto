syntax = "proto3";

package biblioteca;

option java_multiple_files = true;
option java_package = "br.mackenzie.biblioteca.grpc";
option java_outer_classname = "BibliotecaProto";

service BibliotecaService {
  rpc cadastrarLivro (LivroRequest) returns (CadastroResponse);
  rpc listarLivrosPorAutor (AutorRequest) returns (stream Livro);
  rpc registrarEmprestimos (stream EmprestimoRequest) returns (ResumoEmprestimos);
  rpc chatBibliotecario (stream MensagemUsuario) returns (stream SugestaoLivro);
}

message LivroRequest {
  string titulo = 1;
  string autor = 2;
  int32 ano = 3;
  string isbn = 4;
}

message CadastroResponse {
  int64 id = 1;
  string status = 2;
}

message Livro {
  int64 id = 1;
  string titulo = 2;
  string autor = 3;
  int32 ano = 4;
  string isbn = 5;
}

message AutorRequest {
  string autor = 1;
}

message EmprestimoRequest {
  string usuario = 1;
  int64 livro_id = 2;
}

message ResumoEmprestimos {
  int32 total_registrados = 1;
  int64 tempo_processamento_ms = 2;
}

message MensagemUsuario {
  string usuario = 1;
  string texto = 2;
}

message SugestaoLivro {
  string palavra_chave = 1;
  string sugestao = 2;
}
